name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true

            # `submodules: true` above is not enough on Rickub runners: the build came out with
            # an empty `content/`, which fails late and obscurely (the site generates with zero
            # pages, then `/` prerenders as a 404). Fetch it explicitly and stop here if it is
            # still missing, so the log names the cause.
            - name: Fetch the content submodule
              run: |
                  git submodule update --init content
                  test -n "$(ls -A content)"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Prepare Nuxt
              run: npm run prepare

            - name: Lint
              run: npm run lint

            - name: Generate static site
              run: npm run generate

            # Bunny Storage serves a custom 404 only from `bunnycdn_errors/404.html` at the zone
            # root. `nuxt generate` writes the error page to `404.html`, so copy it there;
            # otherwise Bunny falls back to its own generic "404 - File Not Found" page.
            # Deploy steps run only on push to main: deploying an MR build would overwrite
            # production with the branch content.
            - name: Wire the generated 404 page to Bunny's error path
              if: github.event_name == 'push'
              run: |
                  mkdir -p .output/public/bunnycdn_errors
                  cp .output/public/404.html .output/public/bunnycdn_errors/404.html

            - name: Deploy to Bunny
              if: github.event_name == 'push'
              uses: R-J-dev/bunny-deploy@v2.1.1
              with:
                  access-key: ${{ secrets.BUNNY_ACCESS_KEY }}
                  directory-to-upload: ".output/public"
                  storage-endpoint: "https://storage.bunnycdn.com"
                  storage-zone-name: "bloggrify"
                  storage-zone-password: ${{ secrets.BUNNY_STORAGE_ZONE_PASSWORD }}
                  enable-delete-action: true
                  enable-purge-pull-zone: true
                  pull-zone-id: "5063091"
                  # Rickub runners have a narrower uplink than the GitHub-hosted ones this
                  # job used to run on. With 50 parallel PUTs the largest generated files
                  # (18 `_payload.json` over 300 KB) blew past the per-request budget and
                  # failed with "Timeout awaiting 'request'". Fewer connections, more time.
                  concurrency: 10
                  replication-timeout: "15000"
                  request-timeout: "30000"
                  retry-limit: "5"
