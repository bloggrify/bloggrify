name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Prepare Nuxt
              run: npm run prepare

            - name: Lint
              run: npm run lint

            # Build only: the Bunny deploy runs on GitHub, fed by the mirror.
            - name: Generate static site
              run: npm run generate
