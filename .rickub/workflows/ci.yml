name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true

            # `submodules: true` above is not enough on Rickub runners: the build came out with
            # an empty `content/`, which fails late and obscurely (the site generates with zero
            # pages, then `/` prerenders as a 404). Fetch it explicitly and stop here if it is
            # still missing, so the log names the cause.
            - name: Fetch the content submodule
              run: |
                  git submodule update --init content
                  test -n "$(ls -A content)"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Prepare Nuxt
              run: npm run prepare

            - name: Lint
              run: npm run lint

            # Build only: the Bunny deploy runs on GitHub, fed by the mirror.
            - name: Generate static site
              run: npm run generate
